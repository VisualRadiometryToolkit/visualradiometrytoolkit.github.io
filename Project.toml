# The VisualRadiometryToolkit workspace. Not a package: never registered.
# One Manifest.toml (untracked) next to this file serves every project below.

[workspace]
projects = [
    "VisualRadiometryToolkitCore", "VisualRadiometryToolkitIO",
    "ci",
]

# Workspace wiring: every package of this repository resolves to its directory
# here. Pkg merges [sources] per UUID across workspace projects, so these paths
# also apply where a member depends on a sibling. The Visual Geometry Toolkit
# packages are NOT sourced: they come from the General registry, as a user
# gets them.
[deps]
VisualRadiometryToolkitCore = "544ea8c7-2427-4873-ab3e-33acc9dfb29a"
VisualRadiometryToolkitIO = "c447a127-8502-41e7-ac3e-ce2a12d00bd3"

[sources]
VisualRadiometryToolkitCore = {path = "VisualRadiometryToolkitCore"}
VisualRadiometryToolkitIO = {path = "VisualRadiometryToolkitIO"}

[compat]
julia = "1.13"
