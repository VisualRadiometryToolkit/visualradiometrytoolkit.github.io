# One TagBot per package subdirectory: tags <Package>-v<version>; the ssh key
# (the DOCUMENTER_KEY secret: RELEASING.md, "Before the first release") lets the
# tag push trigger Site.yml. Dormant until a package is registered. The job is
# the Visual Geometry Toolkit's reusable workflow, called and never copied.
name: TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"
permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read
jobs:
  TagBot:
    uses: VisualGeometryToolkit/VisualGeometryToolkit.jl/.github/workflows/StackTagBot.yml@workflows/v1
    with:
      packages: '["VisualRadiometryToolkitCore","VisualRadiometryToolkitIO"]'
    secrets:
      DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
