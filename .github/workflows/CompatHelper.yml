# One CompatHelper stream for the whole workspace: every package, its test and
# docs environments and the portal (the Visual Geometry Toolkit's reusable
# workflow, called and never copied).
name: CompatHelper
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    uses: VisualGeometryToolkit/VisualGeometryToolkit.jl/.github/workflows/StackCompatHelper.yml@workflows/v1
    secrets:
      DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
