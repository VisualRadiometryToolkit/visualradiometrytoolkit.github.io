# PRs and pushes to main: the affected packages and their dependents, Linux,
# Julia 1.13 (the whole stack requires 1.13). GPU items record a skip on hosted runners.
#
# The jobs are the Visual Geometry Toolkit's reusable workflow (plan, one test
# job per package, lint), called and never copied; its Julia side is
# VisualGeometryToolkitCore's `stack_ci`, which reads this workspace's
# Project.toml and WORKSPACE.toml. The root project is the tooling project: it
# holds VisualGeometryToolkitCore. The first-registration rules apply (no
# --subsequent): no package here is in a registry yet.
name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  id-token: write   # Codecov upload by OIDC, no token secret
jobs:
  ci:
    uses: VisualGeometryToolkit/VisualGeometryToolkit.jl/.github/workflows/StackCI.yml@workflows/v1
    with:
      tooling-project: '.'
