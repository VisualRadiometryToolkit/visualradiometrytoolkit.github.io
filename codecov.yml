# One flag per package: CI tests only the packages a change affects, so each
# flag carries its last report forward until its package is tested again.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: VisualRadiometryToolkitCore
      paths:
        - VisualRadiometryToolkitCore/src/
        - VisualRadiometryToolkitCore/ext/
    - name: VisualRadiometryToolkitIO
      paths:
        - VisualRadiometryToolkitIO/src/
        - VisualRadiometryToolkitIO/ext/
